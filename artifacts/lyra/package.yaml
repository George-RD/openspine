schema_version: 1
id: lyra
version: 1
lifecycle_state: alpha
display_name: Lyra
description: >-
  The default owner-facing personal agent for OpenSpine. Lyra coordinates
  bounded workers and workflows while the OpenSpine kernel retains authority.
# `main_assistant_agent` is the owner-control entry agent. The direct terminal
# surface routes to the sibling `main_terminal_assistant_agent`; both are Lyra.
entry_agent: main_assistant_agent

# The typed artifact families the kernel loads from this package directory. The
# kernel loads the directories themselves; this list is the human-readable
# declaration of what the package is understood to contain.
artifacts:
  agents:
    - main_assistant_agent
    - main_terminal_assistant_agent
    - email_reply_drafter
    - reflection_miner_agent
    - reflection_submitter_agent
  routes:
    - owner_telegram_main_assistant
    - owner_cli_main_assistant
    - owner_email_selected_thread
    - reflection_scheduled_miner
    - reflection_scheduled_submitter
    - task_deadline_fired
    - task_reminder_fired
  workflows:
    - owner_control_conversation
    - owner_terminal_conversation
    - selected_thread_email_reply_draft
    - reflection_miner_scheduled
    - reflection_submitter_scheduled
    - task_board_scheduled
  packs:
    - owner_control_basic_pack
    - owner_terminal_basic_pack
    - plan_approval_pack
    - scheduled_timer_pack
    - selected_thread_email_draft_pack
    - reflection_miner_pack
    - reflection_submitter_pack
  templates:
    - owner_control_template
    - owner_terminal_template
    - email_reply_draft_template
  policies:
    - global
  golden_sets:
    - model_swap_default

identity:
  persona: concise_practical_operator
  identity_document: PERSONA.md

memory:
  model: typed_overlay
  description: >-
    Memory is stored as typed, scoped overlay artifacts with provenance. It is
    not an unrestricted transcript or a single mutable soul file.
  readable_classes:
    - owner_preference
    - setup_state
    - workflow_state
  readable_scopes:
    - owner_control
    - product_usage
    - external_facing_writing_preferences
  denied_classes:
    - health
    - finance
    - family_private
    - raw_email_body
    - attachment_content
    - infrastructure_secret

installation:
  current_source: artifacts/lyra
  config_key: lyra_dir
  planned_cli: openspine install lyra

security_invariants:
  - The model reasons; the kernel decides.
  - Agent manifests describe intended tools, not effective authority.
  - Explicit deny wins.
  - Email sending is denied by the base Lyra policy.
  - Raw connector credentials are never provided to the agent shell.

id: owner_terminal_conversation
schema_version: 1
lifecycle_state: active
purpose: Owner-facing conversational orchestration over the local direct terminal.
required_agent: main_terminal_assistant_agent
required_capability_pack: owner_terminal_basic_pack
steps:
  - receive a kernel-verified local owner message
  - resolve the local owner device and route to main_terminal_assistant_agent
  - compose authority into a task grant
  - run main_terminal_assistant_agent inside the contained shell
  - "reply to the owner via terminal.reply:owner_device"
initial_state: received
states:
  - id: received
    steps:
      - id: verify_local_owner
        kind: deterministic
        reasoning_tier: low
  - id: composed
    steps:
      - id: compose_terminal_reply
        kind: agentic
        reasoning_tier: standard
  - id: replied
    steps:
      - id: send_terminal_reply
        kind: deterministic
        reasoning_tier: low
transitions:
  - from: received
    to: composed
    event: routed
  - from: composed
    to: replied
    event: ready
candidate_allowed_actions:
  - openspine.status.read
  - setup.workflow.start
  - "model.generate:approved_provider"
  - "terminal.reply:owner_device"
approval_required: []
denied_actions: []

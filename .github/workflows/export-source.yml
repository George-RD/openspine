name: Export source snapshot

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/export-source.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Fetch locked dependencies
        run: |
          cargo fetch --locked
          npm ci
          mkdir -p "$HOME/.cargo/git" "$HOME/.cargo/registry"

      - name: Pack source and local development environments
        run: |
          tar --exclude=.git -czf "$RUNNER_TEMP/openspine-source.tgz" .
          tar -C "$HOME" -czf "$RUNNER_TEMP/openspine-dev-env.tgz" \
            .rustup/toolchains/1.97.1-x86_64-unknown-linux-gnu \
            .cargo/git \
            .cargo/registry
          tar -czf "$RUNNER_TEMP/openspine-node-env.tgz" node_modules

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: openspine-source
          path: ${{ runner.temp }}/openspine-source.tgz
          if-no-files-found: error
          retention-days: 1

      - name: Upload Rust development environment
        uses: actions/upload-artifact@v4
        with:
          name: openspine-dev-env
          path: ${{ runner.temp }}/openspine-dev-env.tgz
          if-no-files-found: error
          retention-days: 1

      - name: Upload Node development environment
        uses: actions/upload-artifact@v4
        with:
          name: openspine-node-env
          path: ${{ runner.temp }}/openspine-node-env.tgz
          if-no-files-found: error
          retention-days: 1

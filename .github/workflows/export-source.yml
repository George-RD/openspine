name: Export source snapshot

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/export-source.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Pack source
        run: tar --exclude=.git -czf openspine-source.tgz .

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: openspine-source
          path: openspine-source.tgz
          if-no-files-found: error
          retention-days: 1

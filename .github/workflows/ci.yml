name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize-contract:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull-request head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply and verify the final contract tree
        shell: bash
        run: |
          set -euo pipefail
          patch=.github/patches/responsibility-contract.patch
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/patches/responsibility-contract.patch')
          text = path.read_text()
          path.write_text(text.replace('\n diff --git ', '\ndiff --git '))
          PY
          test "$(git hash-object "$patch")" = ef5acc7bc1bb8923031a602a3bcb4e9478920bd3
          git apply --check "$patch"
          git apply "$patch"
          test "$(git hash-object .raw/openspine-decision-log.md)" = a76aeac4c5828d8389f31ccc56fd6db484093fe7
          test "$(git hash-object openspec/openspine-change-sequence.md)" = 2af58b90f8bbed36508db4ccc6402497141c6a9f
          test "$(git hash-object openspec/specs/core-runtime-schemas/spec.md)" = 59a2f7a9a66ed05fc0c06ab9c57f66f954f28863
          git checkout 47f46c6c529b458474300d01664e3f0854c2b32a -- .github/workflows/ci.yml
          git rm .github/workflows/apply-responsibility-contract.yml
          git rm -f "$patch"
          git add -A
          git diff --cached --check
          test "$(git write-tree)" = 5e23da22583b2faebb8aab3cb2632bb8b8a5374a

      - name: Commit verified result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "feat: finish protocol-neutral responsibility contract"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

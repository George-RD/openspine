name: Package install workbench
on:
  push:
    branches: [agent/package-install-275]
    paths: [scripts/package-install-apply.py]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'George-RD/openspine' && github.ref == 'refs/heads/agent/package-install-275'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/package-install-275
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Apply exact-context edits and format
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/package-install-apply.py
          cargo fmt --all
          git diff --check
          rm scripts/package-install-apply.py
          rm .github/workflows/package-install-workbench.yml
          git config user.name 'openspine-implementation'
          git config user.email 'openspine-implementation@users.noreply.github.com'
          git add crates scripts/package-install-apply.py .github/workflows/package-install-workbench.yml
          git commit -m 'feat(packages): wire non-serving inactive package installation (#275)'
          git push origin HEAD:refs/heads/agent/package-install-275
      - uses: Swatinem/rust-cache@v2
      - name: Compile and exercise package installation
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test -p openspine-kernel --test package_install_cli

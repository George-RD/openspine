name: Archive terminal chat OpenSpec

on:
  push:
    branches:
      - agent/archive-terminal-chat-spec

permissions:
  contents: write

jobs:
  archive:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out archive branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install OpenSpec
        run: npm ci

      - name: Archive change mechanically
        run: ./node_modules/.bin/openspec archive 2026-07-28-add-terminal-chat-onyx-lfm --yes

      - name: Validate canonical specs
        run: ./node_modules/.bin/openspec validate --all --strict

      - name: Remove one-shot workflow and commit archive
        run: |
          rm .github/workflows/archive-terminal-chat-spec.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Archive produced no changes" >&2; exit 1; }
          git commit -m "Archive terminal chat OpenSpec change"
          git push origin HEAD:agent/archive-terminal-chat-spec

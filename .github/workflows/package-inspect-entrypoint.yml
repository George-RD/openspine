name: Apply reviewed package entrypoint patch
on:
  push:
    branches: [agent/package-inspect-274]
    paths: [.github/workflows/package-inspect-entrypoint.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Apply exact reviewed startup change
        run: |
          set -euo pipefail
          test "$(git hash-object crates/openspine-kernel/src/main.rs)" = 543fb5a8430ae20418c618fe66dea0c09ad68141
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/openspine-kernel/src/main.rs')
          text = path.read_text()
          old = '''#[tokio::main]
          async fn main() -> std::process::ExitCode {
              let cli = Cli::parse();
              // Offline inspection must not read keys, bootstrap state, or start services.
              if let Some(Commands::Package { command }) = &cli.command {
                  return cli::package::run(command);
              }
              tracing_subscriber::fmt()'''
          new = '''fn main() -> std::process::ExitCode {
              let cli = Cli::parse();
              // Offline inspection must not read keys, bootstrap state, or start services.
              if let Some(Commands::Package { command }) = &cli.command {
                  return cli::package::run(command);
              }
              run_with_runtime(cli)
          }

          #[tokio::main]
          async fn run_with_runtime(cli: Cli) -> std::process::ExitCode {
              tracing_subscriber::fmt()'''
          assert text.count(old) == 1, 'Unexpected entrypoint contents'
          path.write_text(text.replace(old, new, 1))
          PY
          test "$(git hash-object crates/openspine-kernel/src/main.rs)" = f5dc65dd756225f5f76e469bed2b854ccc0341e3
          git diff --check
          git add crates/openspine-kernel/src/main.rs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(packages): dispatch inspection before Tokio runtime construction'
          git push origin HEAD:agent/package-inspect-274

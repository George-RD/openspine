<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Where account credentials live</title>
  <desc id="desc">A common model-driven agent keeps broad connector access in the agent process and relies on prompt rules. OpenSpine keeps credentials inside the runtime, gives each task a short-lived grant, and checks every action before a connector runs.</desc>
  <rect width="1200" height="500" fill="#eef3f0"/>

  <g font-family="Arial, sans-serif" fill="#0b1c24">
    <text x="50" y="54" font-size="28" font-weight="900">THE DIFFERENCE IS WHERE THE KEYS LIVE</text>
    <text x="50" y="82" font-size="16" fill="#385058">Prompt rules guide the model. Runtime permissions decide what reaches your accounts.</text>
  </g>

  <g transform="translate(50 112)">
    <path d="M0 0h500l20 20v322H20L0 322z" fill="#f8fbf8" stroke="#b52f10" stroke-width="3"/>
    <path d="M0 0h500l20 20H20L0 0z" fill="#ffd8c9"/>
    <text x="22" y="17" font-family="monospace" font-size="13" font-weight="700" fill="#b52f10">COMMON AGENT SETUP</text>

    <rect x="32" y="58" width="178" height="70" fill="#eef3f0" stroke="#0b1c24" stroke-width="2"/>
    <text x="121" y="83" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#385058">PROMPT RULES</text>
    <text x="121" y="108" text-anchor="middle" font-family="monospace" font-size="15" font-weight="700" fill="#0b1c24">“BE CAREFUL”</text>

    <path d="M218 93h42" stroke="#0b1c24" stroke-width="2"/>
    <path d="m250 85 10 8-10 8" fill="none" stroke="#0b1c24" stroke-width="2"/>

    <rect x="270" y="45" width="218" height="96" fill="#0b1c24" stroke="#0b1c24" stroke-width="2"/>
    <text x="379" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="900" fill="#eef3f0">AGENT PROCESS</text>
    <text x="379" y="103" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#ff6438">HOLDS CONNECTOR KEYS</text>
    <text x="379" y="124" text-anchor="middle" font-family="monospace" font-size="12" fill="#dce7e1">model can steer broad access</text>

    <path d="M379 149v44" stroke="#0b1c24" stroke-width="2"/>
    <path d="m371 183 8 10 8-10" fill="none" stroke="#0b1c24" stroke-width="2"/>

    <rect x="92" y="204" width="336" height="62" fill="#ff6438" stroke="#0b1c24" stroke-width="2"/>
    <text x="260" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="900" fill="#0b1c24">EMAIL · FILES · APPS</text>
    <text x="260" y="251" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#0b1c24">AGENT CALLS CONNECTORS DIRECTLY</text>

    <text x="260" y="309" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#b52f10">One compromised instruction can reach broad account access.</text>
  </g>

  <g transform="translate(650 112)">
    <path d="M0 0h500l20 20v322H20L0 322z" fill="#0b1c24" stroke="#0b1c24" stroke-width="3"/>
    <path d="M0 0h500l20 20H20L0 0z" fill="#8cdec6"/>
    <text x="22" y="17" font-family="monospace" font-size="13" font-weight="700" fill="#0b1c24">WITH OPENSPINE</text>

    <rect x="28" y="54" width="138" height="72" fill="#f8fbf8" stroke="#8cdec6" stroke-width="2"/>
    <text x="97" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#0b1c24">MODEL</text>
    <text x="97" y="103" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#385058">REASONS</text>

    <path d="M174 90h44" stroke="#8cdec6" stroke-width="2"/>
    <path d="m208 82 10 8-10 8" fill="none" stroke="#8cdec6" stroke-width="2"/>

    <rect x="228" y="45" width="264" height="90" fill="#dce7e1" stroke="#8cdec6" stroke-width="2"/>
    <text x="360" y="73" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#0b1c24">SHORT-LIVED TASK GRANT</text>
    <text x="360" y="99" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#0b1c24">one thread · five model calls</text>
    <text x="360" y="119" text-anchor="middle" font-family="monospace" font-size="12" fill="#385058">expires after the task</text>

    <path d="M360 143v35" stroke="#8cdec6" stroke-width="2"/>
    <path d="m352 168 8 10 8-10" fill="none" stroke="#8cdec6" stroke-width="2"/>

    <rect x="28" y="188" width="464" height="98" fill="#f8fbf8" stroke="#8cdec6" stroke-width="2"/>
    <text x="48" y="216" font-family="Arial, sans-serif" font-size="16" font-weight="900" fill="#0b1c24">OPENSPINE HOLDS THE CONNECTOR KEYS</text>
    <text x="48" y="241" font-family="monospace" font-size="12" font-weight="700" fill="#385058">EVERY ACTION STOPS AT ONE GATE</text>

    <rect x="48" y="254" width="96" height="24" fill="#8cdec6"/>
    <text x="96" y="271" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#0b1c24">ALLOW</text>
    <rect x="154" y="254" width="96" height="24" fill="#f3d56b"/>
    <text x="202" y="271" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#0b1c24">ASK</text>
    <rect x="260" y="254" width="96" height="24" fill="#ffd8c9"/>
    <text x="308" y="271" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#b52f10">DENY</text>
    <text x="467" y="271" text-anchor="end" font-family="monospace" font-size="11" font-weight="700" fill="#385058">+ AUDIT</text>

    <text x="260" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#eef3f0">The model can ask. The runtime decides.</text>
  </g>
</svg>
